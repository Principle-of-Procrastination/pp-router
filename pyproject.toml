[project]
name = "pprouter"
version = "1.0.0"
description = "Local multi-company LLM gateway with semantic routing and token reports"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.28,<1",
    "openai>=2.41.1,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "jsonschema>=4.23,<5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
