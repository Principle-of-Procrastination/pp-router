name: pp-router
services:
  gateway:
    image: pp-router-gateway:${PPROUTER_RELEASE:-local}
    build:
      context: ..
      target: gateway
      args:
        PIP_INDEX_URL: ${PPROUTER_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    stop_grace_period: 210s
    volumes:
      - ${PPROUTER_STATE_DIR:-/opt/pp-router/shared}/data:/data
      - ${PPROUTER_STATE_DIR:-/opt/pp-router/shared}/gateway.env:/app/.env:ro
    tmpfs: ["/tmp:size=64m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
  web:
    image: pp-router-web:${PPROUTER_RELEASE:-local}
    build:
      context: ..
      target: web
    restart: unless-stopped
    read_only: true
    entrypoint: [nginx, -g, "daemon off;"]
    depends_on:
      gateway:
        condition: service_healthy
    ports: ["80:80", "443:443"]
    volumes:
      - ${PPROUTER_STATE_DIR:-/opt/pp-router/shared}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PPROUTER_STATE_DIR:-/opt/pp-router/shared}/acme:/var/www/acme:ro
      - ${PPROUTER_STATE_DIR:-/opt/pp-router/shared}/letsencrypt:/etc/letsencrypt:ro
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
  certbot:
    image: certbot/certbot:latest
    profiles: [tls]
    read_only: true
    volumes:
      - ${PPROUTER_STATE_DIR:-/opt/pp-router/shared}/acme:/var/www/acme
      - ${PPROUTER_STATE_DIR:-/opt/pp-router/shared}/letsencrypt:/etc/letsencrypt
    tmpfs: [/var/lib/letsencrypt, /var/log/letsencrypt, /tmp]
